[general]
server = 10.10.11.101
port = 1883
timeout = 120
keepalive = 120
log = /home/pi/rmc/rmc.log
text_topic = /pi/m/c/text

[specials]
youtube_tv = true
twitch_tv = true

[subscribe]
/pi/m/all/#
;/pi/m/1/#
;/pi/m/2/#

[commands]
; line_number = mqtt_topic : mqtt_message: mqtt_response_text : command_executed_on_ubuntu
1 = www:start:launch url:export XDG_RUNTIME_DIR=/run/user/1000 WAYLAND_DISPLAY=wayland-0 XDG_DATA_DIRS=/usr/share/ubuntu; google-chrome --ozone-platform=wayland --disable-features=UserNamespaces --profile-directory=Default --hide-crash-restore-bubble --disable-session-crashed-bubble --start-fullscreen --autoplay-policy=no-user-gesture-required "$$1" &
2 = www:stop:stopping chromium:pkill -INT -f "chrome"
3 = screen:toggle:toggle screen:export DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/1000/bus; loginctl show-session 1 | grep -q LockedHint=yes && (busctl --user set-property org.gnome.Mutter.DisplayConfig /org/gnome/Mutter/DisplayConfig org.gnome.Mutter.DisplayConfig PowerSaveMode i 0; loginctl unlock-session 1) || (loginctl lock-session 1; busctl --user set-property org.gnome.Mutter.DisplayConfig /org/gnome/Mutter/DisplayConfig org.gnome.Mutter.DisplayConfig PowerSaveMode i 1)
4 = volume:set:changing volume:amixer -c 1 set PCM $$1%%
5 = volume:mute:volume mute:amixer -c 1 set PCM 0%%
6 = www:foxholestats:foxholestats:export XDG_RUNTIME_DIR=/run/user/1000 WAYLAND_DISPLAY=wayland-0 XDG_DATA_DIRS=/usr/share/ubuntu; google-chrome --ozone-platform=wayland --disable-features=UserNamespaces --profile-directory=Default --hide-crash-restore-bubble --disable-session-crashed-bubble --start-fullscreen 'https://foxholestats.com' &
7 = www:youtube:youtube:export XDG_RUNTIME_DIR=/run/user/1000 WAYLAND_DISPLAY=wayland-0 XDG_DATA_DIRS=/usr/share/ubuntu; /usr/bin/google-chrome-stable --user-data-dir=/home/pi/.config/google-chrome-tv --remote-debugging-port=9222 --ozone-platform=wayland --start-fullscreen --autoplay-policy=no-user-gesture-required "$$1" & sleep 7; python3 /home/pi/rmc/client/press_f_for_youtube.py

[macro] ; list the above command that can me sent in the macro topic
; line number = corresponding [command] line_number
1 = 3
2 = 6
3 = 5
4 = 14
5 = 2
